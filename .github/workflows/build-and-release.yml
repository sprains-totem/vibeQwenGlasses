# vibeQwenGlasses CI/CD：主分支 push 触发构建，
# 产出 debug + release APK 并上传 artifact。
# release 使用 debug keystore 签名保证可直接安装。
name: Build & Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests (protocol layer)
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Assemble release APK (installable, fixed-keystore signed)
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare named APKs with full version name
        run: |
          mkdir -p release-apks
          cp app/build/outputs/apk/release/app-release.apk release-apks/vibeQwenGlasses-v1.0.0-${{ github.run_number }}-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apks/vibeQwenGlasses-v1.0.0-${{ github.run_number }}-debug.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: vibeQwenGlasses-apks
          path: release-apks/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (APK)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: vibeQwenGlasses v1.0.0-${{ github.run_number }}
          body: |
            ## vibeQwenGlasses v1.0.0-${{ github.run_number }} — 千问 G1 眼镜录音 APP

            - **`vibeQwenGlasses-v1.0.0-${{ github.run_number }}-release.apk`**：Release 构建（固定 Keystore 签名，支持直接覆盖安装升级）
            - **`vibeQwenGlasses-v1.0.0-${{ github.run_number }}-debug.apk`**：Debug 调试构建
          files: release-apks/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}